name: Release

# push to main: release-please opens/updates the release PR; merging it creates a draft
#   release + tag, then the binaries are built, scanned, attached and the release is published.
# workflow_dispatch: unstable prerelease vX.Y.(Z+1)-dev.<sha> with GitHub-generated notes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.rp.outputs.tag_name || steps.dev.outputs.tag }}
      release: ${{ steps.rp.outputs.release_created || steps.dev.outputs.release }}

    steps:
      # App token (not GITHUB_TOKEN) so the release PR triggers PR Validation
      - uses: actions/create-github-app-token@v3
        if: github.event_name == 'push'
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push'
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'

      - name: Compute unstable version
        if: github.event_name == 'workflow_dispatch'
        id: dev
        env:
          SHA: ${{ github.sha }}
        run: |
          # Next patch of the current release so the prerelease sorts above it
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))-dev.${SHA::7}"
          echo "Version: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS universal
    needs: [cut]
    if: needs.cut.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Patch Cargo.toml version (unstable)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          perl -i -pe "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
        shell: bash
      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/statusline \
            target/aarch64-apple-darwin/release/statusline \
            -output statusline-macos
      - name: Smoke test
        run: ./statusline-macos --version
      - uses: actions/upload-artifact@v7
        with:
          name: statusline-macos
          path: statusline-macos

  build-linux:
    name: Build Linux x64
    needs: [cut]
    if: needs.cut.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - name: Patch Cargo.toml version (unstable)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          perl -i -pe "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
        shell: bash
      - name: Build
        run: cargo build --release
      - name: Copy artifact
        run: cp target/release/statusline statusline-linux-x64
      - name: Smoke test
        run: ./statusline-linux-x64 --version
      - uses: actions/upload-artifact@v7
        with:
          name: statusline-linux-x64
          path: statusline-linux-x64

  build-windows:
    name: Build Windows x64
    needs: [cut]
    if: needs.cut.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - name: Patch Cargo.toml version (unstable)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          perl -i -pe "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
        shell: bash
      - name: Build
        run: cargo build --release
      - name: Copy artifact
        run: copy target\release\statusline.exe statusline-windows-x64.exe
        shell: cmd
      - name: Smoke test
        run: .\statusline-windows-x64.exe --version
      - uses: actions/upload-artifact@v7
        with:
          name: statusline-windows-x64
          path: statusline-windows-x64.exe

  publish:
    name: ${{ github.event_name == 'push' && 'Publish GitHub Release' || 'Create GitHub Prerelease' }}
    needs: [cut, build-macos, build-linux, build-windows]
    if: needs.cut.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8

      - name: Generate checksums
        run: |
          (cd statusline-macos   && sha256sum statusline-macos)           > checksums.txt
          (cd statusline-linux-x64 && sha256sum statusline-linux-x64)    >> checksums.txt
          (cd statusline-windows-x64 && sha256sum statusline-windows-x64.exe) >> checksums.txt
          cat checksums.txt

      - name: Scan binaries with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          chmod +x scripts/virustotal-scan.sh
          VT_API_KEY="$VT_API_KEY" bash scripts/virustotal-scan.sh \
            statusline-macos/statusline-macos \
            statusline-linux-x64/statusline-linux-x64 \
            statusline-windows-x64/statusline-windows-x64.exe \
            > /tmp/vt-results.txt

      - name: Build release notes header
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              printf '> ⚠️ **Unstable release** — pre-release build for testing only.\n\n'
            fi
            printf '## 🛡️ Security scan\n\nAll binaries scanned by VirusTotal before this release was published.\n\n| Binary | Result | Report |\n|--------|--------|--------|\n'
            while IFS='|' read -r name malicious total _ gui_url; do
              [ -z "$name" ] && continue
              if [ "$malicious" = "0" ]; then COLOR="brightgreen"; LABEL="clean"; else COLOR="red"; LABEL="flagged"; fi
              printf '| %s | ![%s/%s engines](https://img.shields.io/badge/VirusTotal-%s%%2F%s_%s-%s) | [View report](%s) |\n' \
                "$name" "$malicious" "$total" "$malicious" "$total" "$LABEL" "$COLOR" "$gui_url"
            done < /tmp/vt-results.txt
            printf '\n---\n\n## Install this version\n\n**macOS / Linux / WSL**\n```bash\n%s\n```\n\n**Windows — PowerShell**\n```powershell\n%s\n```\n\n---\n\n' \
              "curl -fsSL https://raw.githubusercontent.com/glauberlima/claude-code-statusline/main/install.sh | bash -s -- --version ${TAG}" \
              "& ([scriptblock]::Create((irm 'https://raw.githubusercontent.com/glauberlima/claude-code-statusline/main/install.ps1'))) -Version ${TAG}"
          } > header.md
          cat header.md

      - name: Publish release (stable)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          # release-please created a draft with the changelog as body; prepend header, attach, publish
          gh release view "$TAG" --json body -q .body > changelog.md
          cat header.md changelog.md > notes.md
          gh release upload "$TAG" --clobber \
            statusline-macos/statusline-macos \
            statusline-linux-x64/statusline-linux-x64 \
            statusline-windows-x64/statusline-windows-x64.exe \
            checksums.txt
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest

      - name: Update README security section (stable)
        if: github.event_name == 'push'
        run: |
          SECURITY_SECTION="## 🛡️ Security\n\nAll release binaries are automatically scanned by [VirusTotal](https://virustotal.com) before publishing.\nEach release page includes the scan results and direct links to the VirusTotal reports for every binary."

          if grep -q "^## 🛡️ Security$" README.md; then
            # Replace existing section up to the next ## heading
            awk '
              /^## 🛡️ Security$/ { skip=1; next }
              skip && /^## / { skip=0 }
              !skip { print }
            ' README.md > README.md.tmp
            # Find insertion point: before "## 📥 Direct Downloads"
            awk -v section="$SECURITY_SECTION" '
              /^## 📥 Direct Downloads/ {
                printf "%b\n\n", section
              }
              { print }
            ' README.md.tmp > README.md
            rm README.md.tmp
          else
            # Insert before "## 📥 Direct Downloads"
            awk -v section="$SECURITY_SECTION" '
              /^## 📥 Direct Downloads/ {
                printf "%b\n\n", section
              }
              { print }
            ' README.md > README.md.tmp
            mv README.md.tmp README.md
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: add security scan section to README [skip ci]"
            git push origin main
          fi

      - name: Create prerelease (unstable)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.cut.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body_path: header.md
          files: |
            statusline-macos/statusline-macos
            statusline-linux-x64/statusline-linux-x64
            statusline-windows-x64/statusline-windows-x64.exe
            checksums.txt
